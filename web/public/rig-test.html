<!doctype html>
<meta charset="utf-8" />
<title>rig bake test</title>
<body style="background:#0A0E14;color:#A9B6C4;font:12px monospace;padding:12px">
<p>리그 베이킹 스모크 테스트 — 개발 서버 전용 (http://localhost:5173/rig-test.html)</p>
<div id="out">baking…</div>
<script type="module">
import { bakeAllRigs, rigFrame, RIG_UNIT, RIG_TOWER, RIG_ENEMY } from '/src/game/rigFrames.ts';

const t0 = performance.now();
await bakeAllRigs();
const out = document.getElementById('out');
out.textContent = `baked in ${Math.round(performance.now() - t0)}ms`;
const all = { ...RIG_UNIT, ...RIG_TOWER, ...RIG_ENEMY };
for (const [key, idx] of Object.entries(all)) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:2px;margin:6px 0;flex-wrap:wrap';
  const label = document.createElement('span');
  label.style.width = '90px';
  label.textContent = key;
  row.appendChild(label);
  for (const m of ['walk', 'attack', 'hit', 'death']) {
    for (let i = 0; i < 5; i++) {
      const f = rigFrame(idx, m, i / 5 + 0.001, m !== 'walk');
      if (f) row.appendChild(f);
    }
    const gap = document.createElement('span');
    gap.textContent = '·';
    row.appendChild(gap);
  }
  out.after(row);
}
console.log('RIG_TEST_OK');
</script>
